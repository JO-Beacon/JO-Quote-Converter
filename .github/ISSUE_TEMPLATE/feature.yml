name: 功能建议
description: 建议新的功能或现有交互改进
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议。提交前请先搜索现有 Issue，确认没有相同或高度相似的建议。

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 请说明你遇到的实际问题，以及什么情况下会需要这项功能。
      placeholder: 我在……时，希望能够……，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望行为
      description: 请描述你期望应用如何工作，包括入口、操作流程和结果。
      placeholder: 希望在……位置增加……，操作后……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 如果你尝试过其他做法，或能够接受不同实现方式，请在此说明。

  - type: dropdown
    id: platform
    attributes:
      label: 相关平台
      options:
        - Windows 和 Android
        - Windows
        - Android
        - 与平台无关
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附上示意图、同类应用参考或其他有助于理解建议的信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同或高度相似的建议。
          required: true
        - label: 此建议与 JO-引号转换的用途直接相关。
          required: true
